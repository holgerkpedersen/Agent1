name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff (parse errors + undefined names must be clean)
        run: >
          ruff check agent_core harnessfix fixcommand tests
          performance_dashboard --select F821

      - name: Ruff (full lint, advisory)
        run: >
          ruff check agent_core harnessfix fixcommand tests
          performance_dashboard
        continue-on-error: true

      - name: Run test suite
        env:
          AGENT_NO_TRACE: "1"
        run: pytest -q --no-cov

      - name: Integration tests (skips if no llama-server)
        # Real-server integration tests need a llama-server binary. On GitHub
        # runners none exists, so they skip cleanly. On a self-hosted runner
        # with the binary on PATH they actually launch/switch/verify.
        continue-on-error: true
        env:
          AGENT_NO_TRACE: "1"
        run: pytest -q -m integration --no-cov
