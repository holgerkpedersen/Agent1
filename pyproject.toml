[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-framework"
version = "0.1.0"
description = "Consolidated agent framework with unified command system, LLM client, and vector memory."
# Point at the real README.md; the previous inline one-line stub shipped as
# the package description, so the root README never reached distribution metadata.
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Agent Framework Team" }]
keywords = ["agent", "llm", "framework", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.24",
    "numpy>=1.24",
    "networkx>=3.1",
    "openai>=1.0",
    # IANA timezone database for zoneinfo.  Linux/macOS read the OS copy;
    # Windows has none, so ZoneInfo('UTC') / ('America/New_York') raise
    # ZoneInfoNotFoundError unless this first-party package is installed.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Extras mirror the lazy-import feature modules: each group provides what its
# feature needs at runtime. CI / development installs everything via [dev].
vision = [
    "pillow>=10.0",
]
secrets = [
    "cryptography>=41.0",
    "keyring>=24.0",
]
# HTTP metrics API.  performance_dashboard/api/endpoints.py imports flask and
# marshmallow at module top level, so importing that module without this extra
# raises ModuleNotFoundError.
dashboard-api = [
    "flask>=2.0",
    "marshmallow>=3.0",
]
# Metrics storage backends.  performance_dashboard/storage/metrics_store.py
# imports `redis.asyncio` at module top level (the RedisBackend and the
# MetricsStore facade), so the store is unusable without this extra.
dashboard-storage = [
    "redis>=4.2",
]
# Optional semantic-embedding backend for HarnessFix
# (AGENT_RAG_EMBEDDER=st).  harnessfix/embed.py imports it lazily and raises a
# clear install instruction when missing, so it stays optional.
rag-embeddings = [
    "sentence-transformers>=2.2",
]
dev = [
    # The build backend named in [build-system].  tests/test_packaging_metadata.py
    # builds a real wheel with `pip wheel`; when setuptools is absent from this
    # interpreter pip falls back to an isolated build and DOWNLOADS a backend
    # mid-test, so the suite needs the network and a clean runner fails with
    # BackendUnavailable.  Declaring it here keeps the build local and offline.
    "setuptools>=61.0",
    "mypy>=1.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # `pytest --testmon` re-runs only tests affected by changed files, so an
    # iterative edit loop does not pay for the full suite every time.
    "pytest-testmon>=2.0",
    # Tests marked `@pytest.mark.asyncio` (decision/perf/gate suites) need a real
    # async plugin; without it every async def fails to run.
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "types-networkx>=3.0",
    "types-pyyaml>=6.0",
    # Test suite exercises the vision + secrets features directly.
    "pillow>=10.0",
    "cryptography>=41.0",
    "keyring>=24.0",
    # Optional at runtime (agent_core/subprocess_utils.py); the llama-server
    # integration tests use it for PID bookkeeping.
    "psutil>=5.9",
    # The performance_dashboard API + metrics store are exercised by the test
    # suite and are hard imports in their own modules (see the
    # dashboard-api / dashboard-storage extras).
    "flask>=2.0",
    "marshmallow>=3.0",
    "redis>=4.2",
]

[project.urls]
Homepage = "https://github.com/holgerkpedersen/Agent1"
Repository = "https://github.com/holgerkpedersen/Agent1"

[project.scripts]
# The package was installable but shipped no console commands; these map the
# repo-root entry scripts to import callables so `pip install` yields real
# CLIs.  The kanban one-off scripts are intentionally NOT entry points: they
# hard-code a machine-local queue path (C:\Dev\Kanban\...).
agent = "agent_core.cli.interactive:cli"
agent-dashboard = "agent_dashboard:main"
agent-bench = "agentic_bench:cli"

[tool.setuptools.packages.find]
# Regression: this listed only "agent_core*", so `pip install agent-framework`
# shipped a wheel that silently dropped harnessfix, fixcommand and
# performance_dashboard (all of them are importable packages and CI lints them).
# Every directory with an __init__.py is included; caches are excluded.
include = [
    "agent_core*",
    "harnessfix*",
    "fixcommand*",
    "performance_dashboard*",
    "benchmarks*",
]
exclude = ["tests*", "docs*", "scripts*", "*.mypy_cache*", "*.pytest_cache*", "*.ruff_cache*"]

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
namespace_packages = false

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = false
follow_imports = "normal"

[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = false
follow_imports = "normal"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v --cov=agent_core --cov-report=term-missing"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "asyncio: async test driven by pytest-asyncio (see the dev extra)",
    "integration: end-to-end tests that require a real llama-server binary on PATH; skipped automatically when none is found",
    "harnessfix_self_test: HarnessFix loop/repair self-tests that mutate agent_core/llm/tool_loop.py; excluded from the autonomous test gate so they cannot revert an applied repair mid-run",
    "slow: latency benchmarks with timing loops and assertions; collect-only skips them via -m 'not slow'",
    "network: live checks against the Hugging Face Hub; set SKIP_NETWORK_TESTS=1 to skip them",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["backups", ".docs", "reports", "checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E741 ambiguous variable names are pervasive in legacy numeric code.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Re-export modules: unused imports are the public API surface.
"**/__init__.py" = ["F401"]

[tool.coverage.run]
# All packaged code must report coverage, not just agent_core: the wheel
# ships harnessfix, fixcommand, performance_dashboard and benchmarks too,
# and the root entry scripts are exercised by tests/test_root_entry_scripts.py.
source = [
    "agent_core",
    "harnessfix",
    "fixcommand",
    "performance_dashboard",
    "benchmarks",
    "agent_dashboard",
    "agentic_bench",
]
# interactive.py starts the REPL at import time (module-level side effects
# via the agent shim), so it cannot be measured by import-time coverage.
omit = ["*/tests/*", "*/__main__.py", "agent_core/cli/interactive.py"]
# Branch coverage is off: pytest-testmon refuses to run with pytest-cov when
# it is on (testmon_core.setup_coverage raises TestmonException).
branch = false

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]